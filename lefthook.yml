pre-commit:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck

pre-push:
  commands:
    tests:
      run: |
        if [ "${RUN_PREPUSH_TESTS:-0}" = "1" ]; then
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "TEST_DATABASE_URL is required when RUN_PREPUSH_TESTS=1" >&2
            exit 1
          fi
          case "${TEST_DATABASE_URL%%\?*}" in
            *_test) ;;
            *)
              echo "TEST_DATABASE_URL must name a dedicated *_test database" >&2
              exit 1
              ;;
          esac
          DATABASE_URL="${TEST_DATABASE_URL}" pnpm test
        else
          pnpm test:software
        fi
